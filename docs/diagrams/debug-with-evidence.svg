<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 788 431" width="788" height="431" role="img" aria-labelledby="title description">
  <title id="title">A slow export, traced to a fix</title>
  <desc id="description">You ask: The CSV export times out on 10,000 rows. Fix it without changing the output. Debug: Reproduce the timeout and trace one database query per row. Code: Use the SQL guide to shape a batched read that preserves row order and duplicates. Test: Rerun the same fixture. Verify the timeout is gone and compare the CSV byte for byte. What you get back: Removed the repeated queries. The 10,000-row fixture completes within its timeout and exports identical bytes.</desc>
  <style>
    text { font-family: ui-monospace, monospace; fill: #fff2e9; }
    .label { font-size: 11px; fill: #ff717d; font-weight: bold; }
    .heading { font-size: 19px; font-weight: bold; }
    .card-title { font-size: 14px; font-weight: bold; }
    .detail { font-size: 13px; fill: #c2aeb2; }
    .centered { text-anchor: middle; }
    .card { fill: #120e13; stroke: #67434c; }
    .featured { fill: #25171d; stroke: #67434c; }
    .branch { stroke: #91646d; stroke-dasharray: 3 3; fill: none; }
    .connector { stroke: #ff717d; fill: none; }
  </style>
  <rect x=".5" y=".5" width="787" height="430" fill="#191217" stroke="#67434c"/>
  <path d="M1 1h786v63H1z" fill="#22171d"/>
  <path d="M1 64h786" stroke="#67434c"/>
  <text class="label" x="19" y="23">02 / ILLUSTRATIVE RUN</text>
  <text class="heading" x="19" y="48">A slow export, traced to a fix</text>
  <rect class="card" x="19" y="80" width="750" height="59"/>
  <text class="card-title" x="33" y="105">YOU ASK</text>
  <text class="detail" x="33" y="127">The CSV export times out on 10,000 rows. Fix it without changing the output.</text>
  <rect x="23" y="160" width="18" height="18" fill="#3b1922"/>
  <text class="label centered" x="32" y="173">1</text>
  <text class="card-title" x="53" y="174">Debug / OWNS THE FIX</text>
  <text class="detail" x="53" y="195">Reproduce the timeout and trace one database query per row.</text>
<rect x="23" y="213" width="18" height="18" fill="#3b1922"/>
  <text class="label centered" x="32" y="226">2</text>
  <text class="card-title" x="53" y="227">Code / SUPPLIES STACK GUIDANCE</text>
  <text class="detail" x="53" y="248">Use the SQL guide to shape a batched read that preserves row order and duplicates.</text>
<rect x="23" y="266" width="18" height="18" fill="#3b1922"/>
  <text class="label centered" x="32" y="279">3</text>
  <text class="card-title" x="53" y="280">Test / CHECKS THE RESULT</text>
  <text class="detail" x="53" y="301">Rerun the same fixture. Verify the timeout is gone and compare the CSV byte for</text>
<text class="detail" x="53" y="320">byte.</text>
  <rect class="featured" x="19" y="334" width="750" height="78"/>
  <rect x="19" y="334" width="3" height="78" fill="#ff717d"/>
  <text class="card-title" x="33" y="359">WHAT YOU GET BACK</text>
  <text class="detail" x="33" y="381">Removed the repeated queries. The 10,000-row fixture completes within its timeout and</text>
<text class="detail" x="33" y="400">exports identical bytes.</text>
</svg>
