  <text class="card-title" x="415" y="205">Decision changes scope?</text>
  <text class="detail" x="415" y="227">You make the call. The agent can keep</text>
<text class="detail" x="415" y="246">working on what you already authorized.</text>
  <rect class="featured" x="19" y="301" width="750" height="59"/>
  <rect x="19" y="301" width="3" height="59" fill="#ff717d"/>
  <text class="card-title" x="33" y="326">Get a result you can trust</text>
  <text class="detail" x="33" y="348">Report what changed, what the checks proved, and any material limits.</text>
</svg>
