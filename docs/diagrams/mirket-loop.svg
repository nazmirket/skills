<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 788 379" width="788" height="379" role="img" aria-labelledby="title description">
  <title id="title">One owner. Help when it matters.</title>
  <desc id="description">Start with your outcome: One skill owns the result and takes the simplest path that can deliver it. Need separate expertise?: Bring in one skill for the specific question or check. The original owner keeps the task. Decision changes scope?: You make the call. The agent can keep working on what you already authorized. Get a result you can trust: Report what changed, what the checks proved, and any material limits.</desc>
  <style>
    text { font-family: ui-monospace, monospace; fill: #fff2e9; }
    .label { font-size: 11px; fill: #ff717d; font-weight: bold; }
    .heading { font-size: 19px; font-weight: bold; }
    .card-title { font-size: 14px; font-weight: bold; }
    .detail { font-size: 13px; fill: #c2aeb2; }
    .centered { text-anchor: middle; }
    .card { fill: #120e13; stroke: #67434c; }
    .featured { fill: #25171d; stroke: #67434c; }
    .branch { stroke: #91646d; stroke-dasharray: 3 3; fill: none; }
    .connector { stroke: #ff717d; fill: none; }
  </style>
  <rect x=".5" y=".5" width="787" height="378" fill="#191217" stroke="#67434c"/>
  <path d="M1 1h786v63H1z" fill="#22171d"/>
  <path d="M1 64h786" stroke="#67434c"/>
