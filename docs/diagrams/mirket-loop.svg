  <rect class="featured" x="19" y="80" width="750" height="59"/>
  <rect x="19" y="80" width="3" height="59" fill="#ff717d"/>
  <text class="card-title" x="33" y="105">Start with your outcome</text>
  <text class="detail" x="33" y="127">One skill owns the result and takes the simplest path that can deliver it.</text>
  <path class="connector" d="M394 139V299m-4-5 4 5 4-5"/>
  <path class="branch" d="M203 180v-10h382v10 M203 277v10h382v-10"/>
  <rect x="327" y="150" width="134" height="17" fill="#191217"/>
  <text class="label centered" x="394" y="163">ONLY WHEN NEEDED</text>
  <rect class="card" x="19" y="180" width="368" height="97"/>
  <text class="card-title" x="33" y="205">Need separate expertise?</text>
  <text class="detail" x="33" y="227">Bring in one skill for the specific</text>
<text class="detail" x="33" y="246">question or check. The original owner</text>
<text class="detail" x="33" y="265">keeps the task.</text>
